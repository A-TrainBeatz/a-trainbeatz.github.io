<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>A-TrainBeatz • Now Playing</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #121212;
      color: #fff;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
    }

    #canvas-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 0;
      pointer-events: none; /* So it doesn't interfere with clicks */
    }

    #track-info {
      position: relative;
      z-index: 10; /* above the canvas */
      background: rgba(30, 30, 30, 0.85);
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.7);
      max-width: 450px;
      width: 90vw;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 2rem;
      color: #1db954;
      position: relative;
      z-index: 10;
      text-align: center;
    }

    img {
      width: 100%;
      max-width: 400px;
      border-radius: 10px;
      margin-bottom: 20px;
      user-select: none;
    }

    .track-name {
      font-size: 1.5rem;
      font-weight: bold;
      color: #fff;
    }

    .artist-name {
      font-size: 1.1rem;
      color: #bbb;
      margin-bottom: 10px;
    }

    .progress-time {
      font-size: 0.95rem;
      color: #888;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.5rem;
      }
      .track-name {
        font-size: 1.2rem;
      }
      .artist-name {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="canvas-bg"></canvas>

  <h1>🎧 A-Train is listening to...</h1>
  <div id="track-info">
    <div id="content">Loading...</div>
  </div>

  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script>
    // ---------- Fluid simulation canvas ----------
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let width, height;
    let drops = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resize);
    resize();

    class Drop {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.radius = 20 + Math.random() * 30;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
        this.color = `hsla(${Math.random() * 360}, 80%, 60%, 0.1)`;
        this.pulsePhase = Math.random() * Math.PI * 2;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.pulsePhase += 0.02;
        if(this.x < -this.radius) this.x = width + this.radius;
        else if(this.x > width + this.radius) this.x = -this.radius;
        if(this.y < -this.radius) this.y = height + this.radius;
        else if(this.y > height + this.radius) this.y = -this.radius;
      }
      draw(ctx) {
        const pulse = 0.75 + Math.sin(this.pulsePhase) * 0.25;
        const r = this.radius * pulse;
        const gradient = ctx.createRadialGradient(this.x, this.y, r*0.2, this.x, this.y, r);
        gradient.addColorStop(0, this.color.replace('0.1', '0.15'));
        gradient.addColorStop(1, this.color.replace('0.1', '0'));
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for(let i=0; i<12; i++) {
      drops.push(new Drop());
    }

    function animate() {
      ctx.clearRect(0,0,width,height);
      for(let drop of drops) {
        drop.update();
        drop.draw(ctx);
      }
      requestAnimationFrame(animate);
    }
    animate();

    // ---------- Spotify Web Playback SDK ----------
    // Spotify's Web Playback SDK provides the actual audio stream in the browser.
    // It requires Spotify Premium and the `streaming` OAuth scope.
    const API_BASE = "https://spotify-backend-pkqi.onrender.com";
    const NOW_PLAYING_URL = `${API_BASE}/now-playing`;
    const PLAYER_TOKEN_URL = `${API_BASE}/player-token`;

    let player = null;
    let deviceId = null;
    let currentTrackId = null;
    let syncing = false;

    function formatTime(ms) {
      const value = Number(ms);
      if (!Number.isFinite(value) || value < 0) return "0:00";
      const minutes = Math.floor(value / 60000);
      const seconds = Math.floor((value % 60000) / 1000);
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;"
      }[char]));
    }

    function renderStatus(message) {
      document.getElementById("content").innerHTML =
        `<p class="status">${escapeHtml(message)}</p>`;
    }

    function renderTrack(data, positionMs) {
      const track = data?.item;
      if (!track) {
        renderStatus("Nothing playing right now.");
        return;
      }

      const artists = (track.artists || []).map(a => a.name).filter(Boolean).join(", ");
      const image = track.album?.images?.[0]?.url || "";

      document.getElementById("content").innerHTML = `
        ${image ? `<img class="album-cover" src="${escapeHtml(image)}" alt="Album cover">` : ""}
        <div class="track-name">${escapeHtml(track.name)}</div>
        <div class="artist-name">by ${escapeHtml(artists || "Unknown artist")}</div>
        <div class="progress-time" id="progress-time">
          Progress: ${formatTime(positionMs)} / ${formatTime(track.duration_ms)}
        </div>
      `;
    }

    async function getPlayerToken() {
      const response = await fetch(PLAYER_TOKEN_URL, {
        credentials: "include",
        cache: "no-store",
        headers: { Accept: "application/json" }
      });

      if (response.status === 401) throw new Error("LOGIN_REQUIRED");
      if (!response.ok) throw new Error(`Player token failed: HTTP ${response.status}`);

      const data = await response.json();
      if (!data.access_token) throw new Error("No Spotify player token returned.");
      return data.access_token;
    }

    async function getCurrentPlayback() {
      const response = await fetch(NOW_PLAYING_URL, {
        credentials: "include",
        cache: "no-store",
        headers: { Accept: "application/json" }
      });

      if (response.status === 204) return null;
      if (!response.ok) throw new Error(`Now playing failed: HTTP ${response.status}`);
      return response.json();
    }

    async function transferCurrentPlayback() {
      if (!deviceId || syncing) return;
      syncing = true;

      try {
        const data = await getCurrentPlayback();
        if (!data?.item) {
          renderStatus("Nothing playing right now.");
          return;
        }

        const positionMs = Math.max(0, Number(data.progress_ms) || 0);
        currentTrackId = data.item.id;
        renderTrack(data, positionMs);

        // Ask Spotify to play the exact track at the timestamp reported by
        // /currently-playing, then let the Web Playback SDK handle the audio.
        const token = await getPlayerToken();
        const response = await fetch(
          `https://api.spotify.com/v1/me/player/play?device_id=${encodeURIComponent(deviceId)}`,
          {
            method: "PUT",
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              uris: [data.item.uri],
              position_ms: positionMs
            })
          }
        );

        if (!response.ok && response.status !== 204) {
          const detail = await response.text();
          throw new Error(`Spotify play failed: HTTP ${response.status} ${detail}`);
        }
      } finally {
        syncing = false;
      }
    }

    function updateProgress(position, duration) {
      const el = document.getElementById("progress-time");
      if (el && duration) el.textContent = `Progress: ${formatTime(position)} / ${formatTime(duration)}`;
    }

    window.onSpotifyWebPlaybackSDKReady = async function () {
      try {
        const initialToken = await getPlayerToken();

        player = new Spotify.Player({
          name: "A-TrainBeatz Web Player",
          getOAuthToken: async callback => {
            try { callback(await getPlayerToken()); }
            catch (e) { console.error(e); callback(initialToken); }
          },
          volume: 0.8
        });

        player.addListener("initialization_error", ({ message }) => console.error(message));
        player.addListener("authentication_error", ({ message }) => {
          console.error(message);
          renderStatus("Spotify authentication expired. Open /login again.");
        });
        player.addListener("account_error", ({ message }) => {
          console.error(message);
          renderStatus("Spotify Web Playback requires Spotify Premium.");
        });
        player.addListener("playback_error", ({ message }) => console.error(message));

        player.addListener("ready", ({ device_id }) => {
          deviceId = device_id;
          console.log("A-TrainBeatz Web Player ready:", deviceId);
          transferCurrentPlayback().catch(error => {
            console.error(error);
            renderStatus("Could not start Spotify audio playback.");
          });
        });

        player.addListener("not_ready", ({ device_id }) => {
          console.warn("Spotify device offline:", device_id);
          deviceId = null;
        });

        player.addListener("player_state_changed", state => {
          if (!state) return;
          currentTrackId = state.track_window?.current_track?.id || currentTrackId;
          updateProgress(
            state.position || 0,
            state.track_window?.current_track?.duration_ms || 0
          );
        });

        await player.connect();
      } catch (error) {
        console.error("Spotify Web Playback startup failed:", error);
        renderStatus(error.message === "LOGIN_REQUIRED"
          ? "Open https://spotify-backend-pkqi.onrender.com/login to connect Spotify."
          : "Could not start Spotify audio playback.");
      }
    };

    async function checkForTrackChange() {
      try {
        const data = await getCurrentPlayback();
        if (!data?.item) return;

        renderTrack(data, data.progress_ms || 0);

        if (deviceId && data.item.id !== currentTrackId) {
          await transferCurrentPlayback();
        }
      } catch (error) {
        console.error("Playback sync check failed:", error);
      }
    }

    checkForTrackChange();
    setInterval(checkForTrackChange, 5000);

  </script>
</body>
</html>
